additionalProperties:
  formFields:
    - default: 3000
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP port
      labelZh: HTTP端口
      required: true
      type: number
      rule: paramPort
    - default: ./data
      edit: true
      envKey: DATA_PATH
      labelEn: Data path
      labelZh: 数据持久化路径
      required: true
      type: text
    - default: https://count.getloli.com
      edit: true
      envKey: APP_SITE
      labelEn: Website URL
      labelZh: 网站地址
      required: false
      type: text
    - default: sqlite
      edit: true
      envKey: DB_TYPE
      labelEn: Database type
      labelZh: 数据库类型
      required: true
      type: select
      values:
        - label: SQLite
          value: sqlite
        - label: MongoDB
          value: mongodb
    - default: mongodb://127.0.0.1:27017
      edit: true
      envKey: DB_URL
      labelEn: MongoDB URL
      labelZh: MongoDB连接地址
      required: false
      type: text
    - default: 10
      edit: true
      envKey: DB_INTERVAL
      labelEn: Database write interval (seconds)
      labelZh: 数据库写入间隔（秒）
      required: true
      type: number
    - default: debug
      edit: true
      envKey: LOG_LEVEL
      labelEn: Log level
      labelZh: 日志级别
      required: true
      type: select
      values:
        - label: Debug
          value: debug
        - label: Info
          value: info
        - label: Warn
          value: warn
        - label: Error
          value: error
        - label: None
          value: none
    - default: ''
      edit: true
      envKey: GA_ID
      labelEn: Google Analytics ID
      labelZh: Google Analytics ID
      required: false
      type: text