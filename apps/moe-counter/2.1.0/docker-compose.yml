services:
  moe-counter:
    image: ghcr.io/journey-ad/moe-counter:v2.1.0
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:3000"
    environment:
      - TZ=Asia/Shanghai
      - APP_SITE=${APP_SITE}
      - APP_PORT=3000
      - DB_TYPE=${DB_TYPE}
      - DB_URL=${DB_URL}
      - DB_INTERVAL=${DB_INTERVAL}
      - LOG_LEVEL=${LOG_LEVEL}
      - GA_ID=${GA_ID}
    volumes:
      - ${DATA_PATH}:/app/data
    labels:
      createdBy: "Apps"
    logging:
      driver: "json-file"
      options:
        max-size: "32m"
        max-file: "7"
networks:
  1panel-network:
    external: true